[project]
name = "bench"
version = "0.1.0"
description = "Agent benchmark: Omnigraph vs raw markdown transcripts"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.158",
    "pyyaml>=6.0.3",
]

[project.scripts]
bench = "bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
