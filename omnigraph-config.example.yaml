# Operator config for the AI Engineer / SPIKE graph.
#
# Your operator config lives at ~/.omnigraph/config.yaml (per user, never
# committed — it can reference credentials). Merge the `servers:`, `profiles:`
# and `aliases:` below into it. Register the server token once with
# `omnigraph login intel-local` (stored in ~/.omnigraph/credentials, 0600).
#
# Aliases are read-only sugar over the graph's stored queries (queries/*.gq);
# run with `omnigraph alias <name> [args…]`. Stored mutations are not
# aliasable — run them with `omnigraph mutate <name> --params '{…}'`.

servers:
  intel-local:
    url: http://127.0.0.1:8081

profiles:
  intel:
    server: intel-local
    default_graph: spike

aliases:
  # ── Lookups (signals.gq, patterns.gq, elements.gq, insights.gq, knowhow.gq) ──
  signal:           { server: intel-local, graph: spike, query: get_signal, args: [slug], format: kv }
  signals:          { server: intel-local, graph: spike, query: recent_signals }
  signal-patterns:  { server: intel-local, graph: spike, query: signal_patterns, args: [slug] }
  signal-elements:  { server: intel-local, graph: spike, query: signal_elements, args: [slug] }
  pattern:          { server: intel-local, graph: spike, query: get_pattern, args: [slug], format: kv }
  patterns:         { server: intel-local, graph: spike, query: patterns_by_kind, args: [kind] }
  pattern-signals:  { server: intel-local, graph: spike, query: pattern_signals, args: [slug] }
  pattern-counter:  { server: intel-local, graph: spike, query: pattern_counter_signals, args: [slug] }
  pattern-elements: { server: intel-local, graph: spike, query: pattern_elements, args: [slug] }
  element:          { server: intel-local, graph: spike, query: get_element, args: [slug], format: kv }
  elements:         { server: intel-local, graph: spike, query: elements_by_kind, args: [kind] }
  element-signals:  { server: intel-local, graph: spike, query: element_signals, args: [slug] }
  element-patterns: { server: intel-local, graph: spike, query: element_patterns, args: [slug] }
  insight:          { server: intel-local, graph: spike, query: get_insight, args: [slug], format: kv }
  insight-patterns: { server: intel-local, graph: spike, query: insight_patterns, args: [slug] }
  insight-elements: { server: intel-local, graph: spike, query: insight_elements, args: [slug] }
  knowhow:          { server: intel-local, graph: spike, query: get_knowhow, args: [slug], format: kv }
  knowhows:         { server: intel-local, graph: spike, query: recent_knowhow }
  knowhow-elements: { server: intel-local, graph: spike, query: knowhow_elements, args: [slug] }

  # ── Drill-downs and leaderboards (explore.gq) ──
  company:          { server: intel-local, graph: spike, query: company_profile, args: [slug], format: kv }
  company-signals:  { server: intel-local, graph: spike, query: company_signals, args: [slug] }
  company-elements: { server: intel-local, graph: spike, query: company_elements, args: [slug] }
  expert-talks:     { server: intel-local, graph: spike, query: expert_artifacts, args: [slug] }
  talk-signals:     { server: intel-local, graph: spike, query: artifact_signals, args: [slug] }
  talk-knowhow:     { server: intel-local, graph: spike, query: artifact_knowhow, args: [slug] }
  talk-chunks:      { server: intel-local, graph: spike, query: artifact_chunks, args: [slug] }
  top-patterns:     { server: intel-local, graph: spike, query: top_patterns_by_signals }
  top-companies:    { server: intel-local, graph: spike, query: top_companies_by_signals }
  signals-domain:   { server: intel-local, graph: spike, query: signals_by_domain, args: [domain] }
  signals-since:    { server: intel-local, graph: spike, query: signals_since, args: [since] }

  # ── Review loop (workflow.gq) ──
  triage:           { server: intel-local, graph: spike, query: orphan_signals }
  momentum:         { server: intel-local, graph: spike, query: pattern_momentum, args: [since] }
  stale:            { server: intel-local, graph: spike, query: stale_patterns, args: [since] }
  contested:        { server: intel-local, graph: spike, query: contested_patterns }
  unsourced:        { server: intel-local, graph: spike, query: unsourced_signals }

  # ── Semantic / hybrid retrieval over transcript chunks (hybrid.gq, traversals.gq) ──
  related:          { server: intel-local, graph: spike, query: related_chunks, args: [q] }
  hybrid-search:    { server: intel-local, graph: spike, query: hybrid_chunks, args: [q] }
  signal-hybrid:    { server: intel-local, graph: spike, query: signal_hybrid, args: [q] }
  talk-semantic:    { server: intel-local, graph: spike, query: talk_semantic, args: [talk, q] }
  sem-context:      { server: intel-local, graph: spike, query: semantic_context, args: [q] }
  sem-patterns:     { server: intel-local, graph: spike, query: semantic_patterns, args: [q] }
  domain-search:    { server: intel-local, graph: spike, query: domain_signal_search, args: [domain, q] }

  # ── Traversals: multi-hop, variable-hop, undirected, negation (traversals.gq) ──
  expert-patterns:  { server: intel-local, graph: spike, query: expert_patterns, args: [slug] }
  pattern-experts:  { server: intel-local, graph: spike, query: pattern_experts, args: [slug] }
  co-presenters:    { server: intel-local, graph: spike, query: expert_collaborators, args: [slug] }
  company-footprint: { server: intel-local, graph: spike, query: company_pattern_footprint, args: [slug] }
  company-tech:     { server: intel-local, graph: spike, query: company_tech_stack, args: [slug] }
  company-risk:     { server: intel-local, graph: spike, query: company_counter_exposure, args: [slug] }
  el-deps:          { server: intel-local, graph: spike, query: element_dependencies, args: [slug] }
  el-dependents:    { server: intel-local, graph: spike, query: element_dependents, args: [slug] }
  el-neighbors:     { server: intel-local, graph: spike, query: element_neighbors, args: [slug] }
  pattern-bridges:  { server: intel-local, graph: spike, query: pattern_bridges }
  pattern-pairs:    { server: intel-local, graph: spike, query: pattern_cooccurrence }
  pattern-knowhow:  { server: intel-local, graph: spike, query: pattern_knowhow, args: [slug] }
  pattern-timeline: { server: intel-local, graph: spike, query: pattern_evidence_timeline, args: [slug] }
  insight-reliance: { server: intel-local, graph: spike, query: insight_company_reliance, args: [slug] }
  gaps-products:    { server: intel-local, graph: spike, query: products_without_developer }
  gaps-patternless: { server: intel-local, graph: spike, query: patternless_elements }
