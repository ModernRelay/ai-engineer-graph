# Cluster-bound policy (applies_to: [cluster]) — the server-level gate.
# Only admins may enumerate the deployment's graphs (GET /graphs).
# NOTE: `kind:` was removed at the 0.9 upgrade — the field is no longer part of
# the policy schema; scope comes solely from cluster.yaml's `applies_to`.
version: 1
groups:
  admins: ["act-admin"]
rules:
  - id: admin-graph-list
    allow:
      actors: { group: admins }
      actions: [graph_list]
